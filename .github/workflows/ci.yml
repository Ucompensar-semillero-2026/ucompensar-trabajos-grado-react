name: CI

# Pruebas, lint, tipos y build en cada push y en cada PR. El despliegue lo
# hace Vercel, que además corre las pruebas antes de compilar (vercel.json):
# si fallan, no se publica.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build (incluye tsc)
        run: npm run build

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
